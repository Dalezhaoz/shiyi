<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; img-src 'self' data: skin:; style-src 'self' 'unsafe-inline'; connect-src 'self' skin:">
  <title>AI 桌面宠物</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 宠物舞台：整体系统原生拖拽区（按住宠物移动窗口，无放大 bug） -->
  <main class="stage" id="stage">
    <!-- 控制按钮已合并进面板窗口顶栏（hover 宠物弹出面板） -->
    <div id="player-container"></div>
    <!-- 情绪 / 提醒气泡：平时隐藏，互动或提醒时在宠物上方弹出 -->
    <div class="bubble" id="bubble">
      <span class="bubble-emoji" id="bubble-emoji"></span>
      <span class="bubble-text" id="bubble-text"></span>
    </div>
  </main>

  <!-- 状态提示：默认隐藏，仅加载/错误时显示 -->
  <div class="status-tip hidden" id="status-tip"></div>

  <!-- Spine Player 运行时（本地 vendored，避免 CDN 依赖） -->
  <script src="vendor/spine-player.min.js"></script>
  <script src="theme.js"></script>
  <script src="app.js"></script>
</body>
</html>
